name: Release

# A tag vX.Y.Z builds the release zip with scripts/package-release.sh, attests its build provenance and attaches the
# zip and SHA256SUMS to a DRAFT release. Nothing is published: the maintainer checks the draft (and the build on the
# reference Mac) and publishes it by hand. Users can check the zip with
#   gh attestation verify Vella-X.Y.Z-arm64.zip --repo TobyNoSkillSon/Vella
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Same toolchains as ci.yml: Command Line Tools Swift 6.3.3 for all Swift code (required here, not just warned about),
# Xcode 26.6 with its Metal Toolchain for MLX's shaders.
#
# Signing. Vella needs Microphone and Accessibility permission, which macOS ties to the app's designated requirement.
# Every release is signed with the project's self-signed identity "Vella Release Signing" (no Apple certificate), so
# the requirement is `identifier "dev.vella.dictation" and certificate leaf = H"<SHA-1 below>"` in every version and
# the permissions survive updates. The p12 and its password are secrets of the GitHub environment `release-signing`,
# which only `v*` tags may use. A release without them fails; there is no unsigned fallback.
env:
  XCODE_APP: /Applications/Xcode_26.6.app
  CLT_SWIFT: /Library/Developer/CommandLineTools/usr/bin/swift
  # SHA-1 of the "Vella Release Signing" certificate (public; the private key is the secret). Changing it is a
  # rotation: every user grants Microphone and Accessibility once more (lab notes on publishing).
  VELLA_SIGNING_SHA1: 2CA2587C8B85EF687E68950E405EC58CE31FC1C7

jobs:
  release:
    name: Build, attest and draft
    runs-on: macos-26
    timeout-minutes: 120
    environment: release-signing   # the signing secrets; deployment rule: v* tags only
    permissions:
      contents: write       # create the draft release and upload its assets
      id-token: write       # sign the provenance attestation
      attestations: write   # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLIST="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          # The installers download the release named after the checkout's Info.plist version.
          if [[ "$VERSION" != "$PLIST" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Resources/Info.plist version $PLIST"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "out=$RUNNER_TEMP/release/$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode and require the release Swift
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          "$CLT_SWIFT" --version
          if ! "$CLT_SWIFT" --version 2>&1 | grep -q 'Apple Swift version 6\.3\.3 '; then
            echo "::error::Releases are built with Command Line Tools Swift 6.3.3"; exit 1
          fi

      - name: Metal Toolchain
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version

      - name: Signing identity (environment release-signing)
        env:
          VELLA_SIGNING_P12_BASE64: ${{ secrets.VELLA_SIGNING_P12_BASE64 }}
          VELLA_SIGNING_P12_PASSWORD: ${{ secrets.VELLA_SIGNING_P12_PASSWORD }}
        run: |
          for v in VELLA_SIGNING_P12_BASE64 VELLA_SIGNING_P12_PASSWORD; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Secret $v is missing from the release-signing environment; releases are never unsigned"; exit 1
            fi
          done
          scripts/ci-keychain.sh import

      - name: Package (scripts/package-release.sh)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # scripts/build.sh signs the helpers, then the bundles, then the app, and verifies it.
          VELLA_SIGN_IDENTITY: ${{ env.VELLA_SIGNING_SHA1 }}
          VELLA_XCODE_DEVELOPER_DIR: ${{ env.XCODE_APP }}/Contents/Developer
          VELLA_RELEASE_OUTPUT_DIR: ${{ steps.version.outputs.out }}
        run: |
          scripts/package-release.sh "$VERSION"
          cat Worker/.build/split-build-provenance.txt
          cd "$VELLA_RELEASE_OUTPUT_DIR" && shasum -a 256 -c SHA256SUMS

      - name: Check the signature in the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OUT: ${{ steps.version.outputs.out }}
        run: |
          CHECK="$RUNNER_TEMP/signature-check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          /usr/bin/unzip -q "$OUT/Vella-$VERSION-arm64.zip" -d "$CHECK"
          APP="$CHECK/Vella.app"
          [[ "$(readlink "$APP/Contents/MacOS/VellaStreamingWorker")" == VellaWorker ]] || { echo '::error::Invalid streaming alias target'; exit 1; }
          codesign --verify --deep --strict "$APP"
          PIN="$(tr '[:upper:]' '[:lower:]' <<<"$VELLA_SIGNING_SHA1")"
          EXPECTED="identifier \"dev.vella.dictation\" and certificate leaf = H\"$PIN\""
          REQUIREMENT="$(codesign -d -r- "$APP" 2>&1 | sed -n 's/^designated => //p')"
          [[ "$REQUIREMENT" == "$EXPECTED" ]] || { echo "::error::Designated requirement is '$REQUIREMENT', expected '$EXPECTED'"; exit 1; }
          for f in MacOS/Vella MacOS/VellaWorker MacOS/VellaStreamingWorker MacOS/VellaModelTool Helpers/VellaInstallTool Helpers/vella \
                   Resources/mlx-swift_Cmlx.bundle; do
            codesign -dvv "$APP/Contents/$f" 2>&1 | grep -x 'Authority=Vella Release Signing' >/dev/null || { echo "::error::$f is not signed by Vella Release Signing"; exit 1; }
          done
          { echo "### Signature"; echo; echo '```'; codesign -dvv "$APP" 2>&1 | grep -E '^(Identifier|Authority|Signature)='; echo "designated => $REQUIREMENT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # GitHub stores attestations for public repositories only (user-owned private ones get "Feature not available").
      # A private copy of this repository (a CI scratch run) still builds and drafts the release, without the attestation.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.out }}/Vella-${{ steps.version.outputs.version }}-arm64.zip

      - name: No attestation in a private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::warning::Private repository: build provenance is not attested (GitHub stores attestations for public repositories only)"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          OUT: ${{ steps.version.outputs.out }}
        run: |
          # Notes: this version's CHANGELOG.md section, then how to verify the download.
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [[ -s "$RUNNER_TEMP/changelog.md" ]]; then cat "$RUNNER_TEMP/changelog.md" >> "$NOTES"; else echo "See CHANGELOG.md." >> "$NOTES"; fi
          {
            echo
            echo "Install or update with \`scripts/install.sh\` from a checkout of this tag (see the README): it downloads this zip and checks it against SHA256SUMS before installing. To check the zip's build provenance:"
            echo
            echo "    gh attestation verify Vella-$VERSION-arm64.zip --repo $GITHUB_REPOSITORY"
            echo
            echo "Signed with Vella's own certificate \"Vella Release Signing\" (SHA-1 \`$VELLA_SIGNING_SHA1\`), the same in every release, so Microphone and Accessibility permissions carry over when you update."
          } >> "$NOTES"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Vella $VERSION" --notes-file "$NOTES" \
            "$OUT/Vella-$VERSION-arm64.zip" "$OUT/Vella-$VERSION-arm64-symbols.zip" "$OUT/SHA256SUMS"

      - name: Remove the temporary keychain
        if: ${{ always() }}
        run: scripts/ci-keychain.sh delete
