name: CI

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "NOTICE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A quick check of every push and pull request: source-only tree, lint, and the logic tests (catalog, selection and
# presence rules, recommendation, docs consistency, updater). The signed release build is release.yml (v* tags); the
# app UI tests, the MLX worker tests and the GPU parity checks need a real Apple Silicon Mac with a display and run in
# scripts/release-check.sh before every release.
env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Only source in git
        run: |
          if git ls-files | grep -E '^(lab|dist|dist-preview|logs|Marketing|\.build)/|\.py$' | grep -v '^Benchmarks/'; then
            echo "::error::Local-only files are tracked (lab/, dist/, logs/, Marketing/, .build/ or Python outside Benchmarks/)"; exit 1
          fi

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP/Contents/Developer" && swift --version

      - name: Lint (swift-format, SwiftLint)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          scripts/lint.sh

      - name: Benchmark reference contract (no downloads or model runs)
        run: python3 -m unittest discover -s Benchmarks/tests -p test_references.py

      # Incremental builds: restore the last .build of this branch (else main's) and build only what changed.
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Packages/VellaWire/.build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**', 'Packages/**/*.swift') }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-${{ github.ref_name }}-
            build-${{ runner.os }}-${{ runner.arch }}-main-

      - name: Logic tests (VellaCoreTests, VellaUpdateTests)
        timeout-minutes: 20
        env:
          CI: "true"
          NSUnbufferedIO: "YES"
        run: xcrun swift test --filter 'VellaCoreTests|VellaUpdateTests'

      - name: VellaWire tests
        timeout-minutes: 10
        run: xcrun swift test --package-path Packages/VellaWire
