name: Bug report
description: Something fails, a transcript is lost or wrong, or a model shows "MLX" instead of "Optimized".
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run `vella diagnose` in Terminal and paste its output below. It contains no recordings or transcripts of yours, only your chip, macOS, versions, engine states and timings on the built-in test clips. The link it prints opens this form with the fields filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw, with the exact error text.
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: vella diagnose output
      render: text
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip
      placeholder: M2 Pro, Mac14,12
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vella version
      description: "`vella status` or the first line of `vella diagnose`"
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, the model and precision, Dictation or Streaming, and the shortcut. Attach audio only if you are happy to share it publicly.
