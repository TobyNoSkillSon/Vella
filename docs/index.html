<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vella benchmarks</title>
<style>
:root{color-scheme:dark;--bg:#101114;--surface:#15161b;--raised:#1c1e25;--hover:#252730;--text:#e6e7ed;--muted:#a7aab7;--line:#30323d;--border:#686c7e;--accent:#c4b5fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1800px;margin:auto;padding:28px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;letter-spacing:-.6px;margin:0;font-weight:600}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.summary{color:var(--muted);margin:8px 0 24px;font-size:14px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}input,select,button{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--border);border-radius:6px;padding:8px 12px}input{width:240px}input::placeholder{color:var(--muted)}button{cursor:pointer}button:hover{background:var(--hover)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}.table-wrap{overflow:auto;max-height:calc(100dvh - 190px);border:1px solid var(--line);border-radius:8px;background:var(--surface)}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}th,td{white-space:nowrap;text-align:right;padding:12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}th{position:sticky;top:0;background:var(--raised);z-index:2;font-weight:500}th:first-child,td:first-child{text-align:left;position:sticky;left:0;min-width:235px;max-width:300px}th:first-child{z-index:3}td:first-child{z-index:1;background:var(--surface);white-space:normal}td:first-child a{color:var(--text)}th button{border:0;padding:2px 0;background:transparent;border-radius:0;white-space:nowrap;font-size:13px}th button::after{content:' ↕';display:inline-block;width:16px;color:var(--muted)}th[aria-sort=ascending] button::after{content:' ↑';color:var(--accent)}th[aria-sort=descending] button::after{content:' ↓';color:var(--accent)}tbody tr:hover td{background:var(--hover)}td[data-key=mode],td[data-key=memory]{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:32px;color:var(--muted)}@media(max-width:700px){main{padding:16px}h1{font-size:22px}.summary{margin-bottom:18px}.controls{gap:8px}input{width:100%}select{max-width:100%;flex:1;min-width:130px}#count{margin-left:0}.table-wrap{max-height:calc(100dvh - 260px)}th:first-child,td:first-child{min-width:175px;max-width:175px}th,td{padding:10px}}
</style>
</head>
<body><main>
<header><h1>Vella benchmarks</h1><a href="https://github.com/TobyNoSkillSon/Vella">GitHub ↗</a></header>
<p class="summary">M5 Max · 128 GiB · 2 passes · 144 English clips · 34 speakers · 20m15s of audio. MLX memory is not total app RAM.</p>
<div class="controls">
<input id="search" type="search" aria-label="Search models" placeholder="Search models…">
<select id="mode" aria-label="Inference mode"><option value="">Batch + Streaming</option><option>Batch</option><option>Streaming</option></select>
<button id="reset" type="button">Reset</button><span id="count" role="status" aria-live="polite"></span>
</div>
<div class="table-wrap" tabindex="0" role="region" aria-label="Sortable benchmarks; scroll horizontally for more columns">
<table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
</div>
<noscript>Enable JavaScript to view and sort the benchmark table.</noscript>
</main><script src="data.js?v=canonical-1"></script><script src="table.js?v=canonical-1"></script></body></html>
